<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chandelle romaine — visionneur 3D</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="panel title-panel">
      <h1>Chandelle romaine</h1>
      <p class="subtitle">Habillage festif multicolore — vue catalogue</p>
    </header>

    <aside class="panel controls-panel">
      <h2>Points de vue</h2>
      <div class="btn-row">
        <button data-view="product" class="active">Vue produit</button>
        <button data-view="muzzle">Extrémité rouge</button>
        <button data-view="top">Capuchon bleu</button>
        <button data-view="hero">Héro 3/4</button>
      </div>

      <h2>Animation</h2>
      <div class="btn-row">
        <button id="btn-rotate">Rotation auto</button>
        <button id="btn-ignite">🔥 Allumer la mèche</button>
        <button id="btn-reset">Réinitialiser</button>
      </div>

      <h2>Fiche technique</h2>
      <ul class="specs">
        <li><span>Longueur</span><b>42 cm</b></li>
        <li><span>Diamètre</span><b>17 mm</b></li>
        <li><span>Impression</span><b>gerbes multicolores</b></li>
        <li><span>Extrémité</span><b>capuchon bleu</b></li>
        <li><span>Mèche</span><b>courte, rouge</b></li>
      </ul>
      <p class="hint">Souris : orbite · molette : zoom · clic droit : déplacer</p>
    </aside>

    <div id="status" class="panel status-panel hidden"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
